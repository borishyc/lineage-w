<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天堂W｜A 隊首領王表</title><style>body{background:#10151d;color:#eee;font:16px system-ui,'Noto Sans TC';max-width:700px;margin:auto;padding:16px}header{background:#294e72;padding:18px;border-radius:12px}h1{margin:0}input{padding:12px;background:#202c3a;color:#fff;border:1px solid #66788a;border-radius:6px;width:100%;box-sizing:border-box}button{background:#40536b;color:white;border:1px solid #61758d;padding:10px;border-radius:6px;margin:8px 4px 8px 0}.row{padding:12px;border-bottom:1px solid #3a4654;display:flex;justify-content:space-between}.muted{color:#aeb9c9;font-size:13px}.warn{border:1px solid #ad8b53;padding:12px;margin:12px 0;color:#f1cb8e}</style><header><h1>天堂W｜A 隊首領王表</h1><div>V15.4 Worker API 唯讀測試</div></header><div class="warn">此頁不提供 K / Z / T / RESTART；團隊驗證金鑰僅供測試，勿公開分享。</div><label>V15 測試 Worker 網址（例如 https://xxx.workers.dev）<input id="url" placeholder="https://your-test-worker.workers.dev" autocomplete="off"></label><label>A 隊測試讀取金鑰<input id="key" type="password" autocomplete="off"></label><button id="go">讀取 A 隊王表</button><p id="status" class="muted">等待連線</p><div id="list"></div><details><summary>安全診斷</summary><pre id="diag"></pre></details><script>
const A='A';const names={1:'尼羅德',2:'夫人',3:'飛龍3',4:'飛龍4',5:'卡司特王',6:'大腳',7:'黑虎',8:'德雷克',9:'莫莉提亞',10:'飛龍1',11:'飛龍2',12:'殺戮者',13:'麥肯',14:'蜥蜴王',15:'庫約',16:'烏勒庫斯',17:'奈克諾斯',18:'拉馬修',19:'庫爾託',20:'四色',21:'哈格瑪',22:'克洛林',23:'史前巨鱷',24:'二巨',25:'奧杜亞'};
const $=id=>document.getElementById(id);const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('go').onclick=async()=>{const url=$('url').value.trim().replace(/\/$/,'');const key=$('key').value;if(!/^https:\/\//.test(url)||!key){$('status').textContent='請填入 HTTPS Worker 網址及金鑰';return}
 $('status').textContent='讀取中…';$('list').innerHTML='';try{const r=await fetch(url+'/api/board?team='+A,{headers:{Authorization:'Bearer '+key},cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);const states=j.states||{};const entries=Object.entries(states);$('diag').textContent=JSON.stringify({team:A,stateCount:entries.length,firstKeys:entries.slice(0,3).map(([k,v])=>({key:k,fields:Object.keys(v||{})}))},null,2);$('status').textContent='Worker 已回應：'+entries.length+' 筆狀態（時間欄位待驗證）';for(const [id,st] of entries){const ts=Number(st?.respawnAt||0);const name=names[id]||('王 '+id);const d=ts?new Date(ts).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}):'尚無時間';const row=document.createElement('div');row.className='row';row.innerHTML='<span>'+safe(name)+'</span><span>'+safe(d)+'</span>';$('list').append(row)} }catch(e){$('status').textContent='讀取失敗：'+e.message;$('diag').textContent=JSON.stringify({team:A,error:e.message},null,2)} };
</script></html>
