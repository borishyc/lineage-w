<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天堂W｜B 隊首領王表</title><style>
:root{color-scheme:dark;--line:#34445a;--gold:#e9be70;--muted:#a5b4c8;--bg:#0d1219;--panel:#182334;--tone:#3975cb}
*{box-sizing:border-box}body{background:var(--bg);color:#f3f5fa;font:15px system-ui,-apple-system,'Noto Sans TC',sans-serif;max-width:880px;margin:auto;padding:12px}
header{background:linear-gradient(120deg,#27354a,#132033);border:1px solid #526075;border-radius:12px;padding:18px 16px;margin-bottom:12px}body.team-b{--tone:#2aa992}body.team-b header{background:linear-gradient(120deg,#214b43,#142a35)}h1{margin:0 0 5px;color:var(--gold);font-size:25px;letter-spacing:1px}.subtitle{color:#b3c4dc;font-size:13px}
.notice{color:#e3c08c;border:1px solid #74603e;padding:10px;border-radius:7px;font-size:12px;margin-bottom:14px}label{display:block;color:#dae3ee;font-weight:600;margin:9px 0;font-size:13px}input{display:block;width:100%;padding:11px;border-radius:7px;background:#202c3b;border:1px solid #55657a;color:#fff;font-size:15px;margin-top:5px}button{cursor:pointer;border:1px solid #63758f;background:#334b69;color:#f5f7ff;border-radius:7px;padding:10px 13px;font-size:14px;font-weight:600}button:active{transform:translateY(1px)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:13px 0}.actions .primary{background:var(--tone);border-color:var(--tone)}.muted{color:var(--muted);font-size:12px;margin:5px 0 12px}.filters{display:flex;gap:7px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:2}.filters button{flex:1;background:#202b3a;padding:9px 6px;font-size:13px}.filters button.active{background:var(--tone);border-color:var(--tone)}.stats{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 2px;color:#b7c4d6;font-size:12px}
.boss-card{background:var(--panel);border:1px solid #39485c;border-left:5px solid #3975cb;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;margin:8px 0;min-height:70px}.boss-card.fixed{border-left-color:#3caf7f;background:#152d2a}.boss-card.near{border-color:#e2b84d;background:#332d1d}.boss-card.danger{border-color:#e45454;animation:alert 1s infinite}.name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}.name strong{font-size:18px}.name small{color:#93a8bf;font-size:11px;width:100%;padding-left:16px}.dot{width:8px;height:8px;border-radius:50%;background:#5594ef;flex:none}.fixed .dot{background:#52cf9a}.time-area{text-align:right;flex-shrink:0}.birth{font-size:12px;color:#becce2;font-variant-numeric:tabular-nums}.countdown{font-size:19px;font-weight:800;color:#efcd79;font-variant-numeric:tabular-nums;margin-top:4px}.danger .countdown{color:#ff6767}.near .countdown{color:#ffd458}.empty{text-align:center;padding:30px;color:#a8b6cb}details{margin:18px 0;color:#a4b5ce}pre{overflow-x:auto;white-space:pre-wrap;font-size:11px} @keyframes alert{50%{box-shadow:0 0 14px #a94545}}
@media(max-width:480px){body{padding:8px}header{padding:14px}h1{font-size:21px}.boss-card{padding:10px 8px}.name strong{font-size:16px}.birth{font-size:11px}.countdown{font-size:17px}}
</style></head><body class="team-b"><header><h1>天堂W｜B 隊首領王表</h1><div class="subtitle">V15.7 復古計時看板・每 30 秒自動同步・唯讀測試</div></header><div class="notice">此頁僅查詢，不提供 K／Z／T／RESTART。測試金鑰請勿分享，正式上線仍須進一步設計登入權限。</div><label>Worker 網址<input id="url" placeholder="https://xxx.workers.dev" autocomplete="off" type="url"></label><label>B 隊讀取金鑰<input id="key" type="password" autocomplete="off"></label><div class="actions"><button class="primary" id="go">讀取 B 隊王表</button><span id="lastFetch" class="muted">尚未讀取；首次成功後每 30 秒自動同步</span></div><p id="status" class="muted">等待連線</p><div class="filters"><button data-filter="all" class="active">全部</button><button data-filter="field">野外首領</button><button data-filter="fixed">固定首領</button></div><div class="stats"><span>首領列表（台灣時間）</span><span id="count">0 筆</span></div><main id="list"></main><details><summary>安全診斷（不顯示金鑰）</summary><pre id="diag"></pre></details><script>const TEAM='B';
const names={1:'尼羅德',2:'夫人',3:'飛龍3',4:'飛龍4',5:'卡司特王',6:'大腳',7:'黑虎',8:'德雷克',9:'莫莉提亞',10:'飛龍1',11:'飛龍2',12:'殺戮者',13:'麥肯',14:'蜥蜴王',15:'庫約',16:'烏勒庫斯',17:'奈克諾斯',18:'拉馬修',19:'庫爾託',20:'四色',21:'哈格瑪',22:'克洛林',23:'史前巨鱷',24:'二巨',25:'奧杜亞'};
const $=id=>document.getElementById(id);const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let hasConnected=false;let fetching=false;let lastSync=0;
async function refreshBoard(manual=false){
 if(fetching)return;
 if(!manual&&(!hasConnected||document.hidden))return;const url=$('url').value.trim().replace(/\/$/,'');const key=$('key').value;if(!/^https:\/\//.test(url)||!key){if(manual)$('status').textContent='請填入 HTTPS Worker 網址及金鑰';return}
 fetching=true; if(manual)$('status').textContent='讀取中…';try{const r=await fetch(url+'/api/board?team='+TEAM,{headers:{Authorization:'Bearer '+key},cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);const states=j.states||{};const entries=Object.entries(states);const now=Date.now();
 const bosses=j.bosses||{};const fixed=j.fixedSchedules||{};const mult=j.eventActive===true?Number(j.eventConfig?.cooldownMultiplier??0.5):1;
 const rows=[];for(const [id,st] of entries){const b=bosses[id]||Object.values(bosses).find(x=>String(x?.id)===String(id));if(!b||b.enabled===false)continue;
 const cycle=Number(b.cooldownHours)*mult*3600000;let when=Number(st?.respawnAt);if(!Number.isFinite(when)||!when||!Number.isFinite(cycle)||cycle<=0)continue;
 if(when<=now)when+=(Math.floor((now-when)/cycle)+1)*cycle;
 rows.push({name:b.name||names[id]||'王 '+id,when,fixed:false});}
 const today=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',weekday:'short'}).format(new Date());const weekday=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(today);
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const val=k=>parts.find(x=>x.type===k)?.value;
 for(const item of Object.values(fixed)){if(!item||item.enabled===false||Number(item.weekday)!==weekday||!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(item.time||'')))continue;
 const when=Date.parse(`${val('year')}-${val('month')}-${val('day')}T${item.time}:00+08:00`);if(Number.isFinite(when)&&when>=now)rows.push({name:item.bossName||'固定首領',when,fixed:true});}
 rows.sort((a,b)=>a.when-b.when||a.name.localeCompare(b.name,'zh-TW'));
 $('diag').textContent=JSON.stringify({team:TEAM,stateCount:entries.length,projectedField:rows.filter(x=>!x.fixed).length,fixedToday:rows.filter(x=>x.fixed).length,eventActive:j.eventActive,multiplier:mult,firstKeys:entries.slice(0,3).map(([k,v])=>({key:k,fields:Object.keys(v||{})}))},null,2);
 liveRows=rows; renderBoard();
 hasConnected=true;lastSync=Date.now();
 $('status').textContent='同步成功（每 30 秒自動更新）：'+entries.length+' 筆原始狀態｜野外首領 '+rows.filter(x=>!x.fixed).length+' 筆｜今日固定首領 '+rows.filter(x=>x.fixed).length+' 筆';
 $('lastFetch').textContent='最後讀取：'+new Date().toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});
 }catch(e){$('status').textContent='同步失敗（保留上次畫面）：'+e.message;$('diag').textContent=JSON.stringify({team:TEAM,error:e.message},null,2)}finally{fetching=false}
}
$('go').onclick=()=>refreshBoard(true);
setInterval(()=>{if(hasConnected&&!document.hidden)refreshBoard(false)},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&hasConnected&&Date.now()-lastSync>=30000)refreshBoard(false)});

let liveRows=[];let filter='all';
const fmtTime=ms=>new Date(ms).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
const duration=ms=>{const sec=Math.floor(Math.abs(ms)/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (ms<0?'已過 ':'')+(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
function renderBoard(){const now=Date.now();let shown=liveRows.filter(r=>filter==='all'||(filter==='fixed' ? r.fixed:!r.fixed));
 $('list').innerHTML=shown.length?'':'<div class="empty">目前沒有符合篩選條件的首領</div>';
 shown.forEach(row=>{const diff=row.when-now, el=document.createElement('article');el.className='boss-card '+(row.fixed?'fixed':'field')+(diff>=0&&diff<=60000?' danger':diff>60000&&diff<=180000?' near':'');el.innerHTML='<div class="name"><span class="dot"></span><strong>'+safe(row.name)+'</strong><small>'+(row.fixed?'固定首領':'野外首領')+'</small></div><div class="time-area"><div class="birth">'+safe(fmtTime(row.when))+'</div><div class="countdown">'+safe(duration(diff))+'</div></div>';$('list').append(el)});
 $('count').textContent=shown.length+' 筆';}
 document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderBoard()}));
 setInterval(()=>{if(liveRows.length)renderBoard()},1000);
</script></body></html>
