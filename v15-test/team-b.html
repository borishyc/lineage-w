<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天堂W｜B 隊首領王表</title><style>body{background:#10151d;color:#eee;font:16px system-ui,'Noto Sans TC';max-width:700px;margin:auto;padding:16px}header{background:#275a4b;padding:18px;border-radius:12px}h1{margin:0}input{padding:12px;background:#202c3a;color:#fff;border:1px solid #66788a;border-radius:6px;width:100%;box-sizing:border-box}button{background:#40536b;color:white;border:1px solid #61758d;padding:10px;border-radius:6px;margin:8px 4px 8px 0}.row{padding:12px;border-bottom:1px solid #3a4654;display:flex;justify-content:space-between}.muted{color:#aeb9c9;font-size:13px}.warn{border:1px solid #ad8b53;padding:12px;margin:12px 0;color:#f1cb8e}</style><header><h1>天堂W｜B 隊首領王表</h1><div>V15.5 LINE V14 時間演算法・唯讀測試</div></header><div class="warn">此頁不提供 K / Z / T / RESTART；團隊驗證金鑰僅供測試，勿公開分享。</div><label>V15 測試 Worker 網址（例如 https://xxx.workers.dev）<input id="url" placeholder="https://your-test-worker.workers.dev" autocomplete="off"></label><label>B 隊測試讀取金鑰<input id="key" type="password" autocomplete="off"></label><button id="go">讀取 B 隊王表</button><p id="status" class="muted">等待連線</p><div id="list"></div><details><summary>安全診斷</summary><pre id="diag"></pre></details><script>
const B='B';const names={1:'尼羅德',2:'夫人',3:'飛龍3',4:'飛龍4',5:'卡司特王',6:'大腳',7:'黑虎',8:'德雷克',9:'莫莉提亞',10:'飛龍1',11:'飛龍2',12:'殺戮者',13:'麥肯',14:'蜥蜴王',15:'庫約',16:'烏勒庫斯',17:'奈克諾斯',18:'拉馬修',19:'庫爾託',20:'四色',21:'哈格瑪',22:'克洛林',23:'史前巨鱷',24:'二巨',25:'奧杜亞'};
const $=id=>document.getElementById(id);const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('go').onclick=async()=>{const url=$('url').value.trim().replace(/\/$/,'');const key=$('key').value;if(!/^https:\/\//.test(url)||!key){$('status').textContent='請填入 HTTPS Worker 網址及金鑰';return}
 $('status').textContent='讀取中…';$('list').innerHTML='';try{const r=await fetch(url+'/api/board?team='+B,{headers:{Authorization:'Bearer '+key},cache:'no-store'});const j=await r.json();if(!r.ok)throw Error(j.error||'HTTP '+r.status);const states=j.states||{};const entries=Object.entries(states);const now=Date.now();
 const bosses=j.bosses||{};const fixed=j.fixedSchedules||{};const mult=j.eventActive===true?Number(j.eventConfig?.cooldownMultiplier??0.5):1;
 const rows=[];for(const [id,st] of entries){const b=bosses[id]||Object.values(bosses).find(x=>String(x?.id)===String(id));if(!b||b.enabled===false)continue;
 const cycle=Number(b.cooldownHours)*mult*3600000;let when=Number(st?.respawnAt);if(!Number.isFinite(when)||!when||!Number.isFinite(cycle)||cycle<=0)continue;
 if(when<=now)when+=(Math.floor((now-when)/cycle)+1)*cycle;
 rows.push({name:b.name||names[id]||'王 '+id,when,fixed:false});}
 const today=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',weekday:'short'}).format(new Date());const weekday=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(today);
 const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const val=k=>parts.find(x=>x.type===k)?.value;
 for(const item of Object.values(fixed)){if(!item||item.enabled===false||Number(item.weekday)!==weekday||!/^([01]\d|2[0-3]):[0-5]\d$/.test(String(item.time||'')))continue;
 const when=Date.parse(`${val('year')}-${val('month')}-${val('day')}T${item.time}:00+08:00`);if(Number.isFinite(when)&&when>=now)rows.push({name:item.bossName||'固定首領',when,fixed:true});}
 rows.sort((a,b)=>a.when-b.when||a.name.localeCompare(b.name,'zh-TW'));
 $('diag').textContent=JSON.stringify({team:A,stateCount:entries.length,projectedField:rows.filter(x=>!x.fixed).length,fixedToday:rows.filter(x=>x.fixed).length,eventActive:j.eventActive,multiplier:mult,firstKeys:entries.slice(0,3).map(([k,v])=>({key:k,fields:Object.keys(v||{})}))},null,2);
 $('status').textContent='Worker 已回應：'+entries.length+' 筆原始狀態；預計野王 '+rows.filter(x=>!x.fixed).length+' 筆，今日固定王 '+rows.filter(x=>x.fixed).length+' 筆';
 for(const row of rows){const d=new Date(row.when).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false});const el=document.createElement('div');el.className='row';el.innerHTML='<span>'+(row.fixed?'🟢 ':'🔵 ')+safe(row.name)+'</span><span>'+safe(d)+'</span>';$('list').append(el)}
 }catch(e){$('status').textContent='讀取失敗：'+e.message;$('diag').textContent=JSON.stringify({team:B,error:e.message},null,2)} };
</script></html>
