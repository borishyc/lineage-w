<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RC3 鈴鐺 Icon 十色預覽</title><style>body{font:16px system-ui;background:#101827;color:#f3e6ca;padding:18px;max-width:950px;margin:auto}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.item{background:#1b2940;border:1px solid #445474;border-radius:14px;text-align:center;padding:10px}.item img{width:100%}h1{font-size:22px}</style><h1>V20 RC3｜原版鈴鐺十色光暈預覽</h1><p>圖形、雙劍、骷髏、金屬保持相同；為保留既有圖片細節，十色圖檔一次製作後固定使用。</p><div id="grid"></div><script>let v=[['red','烈焰紅'],['orange','琥珀橙'],['gold','黃金'],['green','翡翠綠'],['teal','青綠'],['ice','冰晶藍'],['blue','皇家藍'],['purple','幻影紫'],['pink','霓虹粉'],['silver','銀白']];for(let [id,name] of v){let x=document.createElement('div');x.className='item';let img=document.createElement('img');img.src='icons/glow/bell-'+id+'.png';img.alt=name;x.append(img);let label=document.createElement('div');label.textContent=name;x.append(label);document.querySelector('#grid').append(x)}</script></html>
