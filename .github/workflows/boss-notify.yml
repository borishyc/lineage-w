
name: Lineage W Boss Notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lineagew-boss-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check notification backend
        run: |
          echo "Lineage W notification scheduler is ready."
          echo "Current UTC time: $(date -u)"
          echo "FCM sending is not enabled yet."
