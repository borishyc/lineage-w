name: Lineage W Boss Notifications

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lineagew-boss-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase Admin SDK
        run: npm install --no-save --no-package-lock firebase-admin@13

      - name: Test Firebase connection
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-firebase.cjs

      - name: Send single-device FCM test
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_FCM_UID: ${{ secrets.TEST_FCM_UID }}
        run: node scripts/send-test-fcm.cjs

      - name: Send scheduled boss reminders
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_FCM_UID: ${{ secrets.TEST_FCM_UID }}
        run: node scripts/boss-notify.cjs

      - name: Diagnose boss-format FCM push
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_FCM_UID: ${{ secrets.TEST_FCM_UID }}
        run: node scripts/diagnose-boss-push.cjs
