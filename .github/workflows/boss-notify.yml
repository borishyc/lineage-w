
name: Lineage W Boss Notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lineagew-boss-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase Admin SDK
        if: github.event_name == 'workflow_dispatch'
        run: npm install --no-save --no-package-lock firebase-admin@13

      - name: Test Firebase connection
        if: github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/check-firebase.cjs

      - name: Scheduled run placeholder
        if: github.event_name == 'schedule'
        run: |
          echo "Boss notification schedule triggered."
          echo "Actual FCM sending is not enabled yet."
